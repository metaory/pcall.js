name: release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    permissions:
      contents: write
      id-token: write
      issues: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Build artifact
        run: pnpm run build

      - name: Release PR
        uses: changesets/action@v2
        with:
          version-script: pnpm dlx @changesets/cli version
          publish-script: pnpm dlx @changesets/cli publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
